<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020618">
<meta name="description" content="ES Chat Pro — شات عربي سريع وآمن">
<meta property="og:site_name" content="ES Chat Pro">
<meta property="og:title" content="ES Chat Pro">
<meta property="og:description" content="شات عربي سريع وآمن">
<meta property="og:image" content="https://es-chat-one.vercel.app/assets/icon-512.png">
<title>ES Chat Pro</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="boot" class="screen center"><img src="assets/logo-128.png" alt="" class="boot-logo"><div id="bootError" class="login-msg" hidden></div></div>

<section id="login" class="screen center hidden">
  <div class="login-card">
    <img src="assets/icon-512.png" alt="ES Chat Pro" class="login-icon">
    <h1>ES Chat Pro</h1>
    <p>سجّل دخولك وكمّل محادثاتك.</p>
    <button id="googleBtn" class="btn-google">
      <svg viewBox="0 0 48 48" width="20" height="20"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      <span>الدخول بحساب جوجل</span>
    </button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</section>

<section id="onboard" class="screen scroll hidden"><div id="onboardBox" class="form-card"></div></section>

<section id="banned" class="screen center hidden">
  <div class="login-card">
    <h1>الحساب موقوف</h1>
    <p>تم إيقاف هذا الحساب من إدارة الموقع.</p>
    <button class="btn-ghost" id="bannedOut">تسجيل الخروج</button>
  </div>
</section>

<section id="notice" class="screen center hidden">
  <div class="login-card">
    <img src="assets/icon-192.png" alt="" class="notice-icon">
    <h1 id="noticeT"></h1>
    <p id="noticeP"></p>
    <button class="btn-ghost" id="noticeOut">تسجيل الخروج</button>
  </div>
</section>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="top">
      <div class="brand"><img src="assets/logo-128.png" alt="" class="logo"><div><b>ES Chat Pro</b><small id="whoami"></small></div></div>
      <div class="top-actions">
        <button class="icon" id="newBtn" title="جديد" aria-label="جديد"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>
        <button class="icon hidden" id="ownerBtn" title="لوحة المالك"></button>
        <button class="icon" id="meBtn" title="حسابي"></button>
      </div>
    </div>
    <div id="annBar" class="ann hidden"></div>
    <div id="notifBar" class="notif-bar hidden"></div>
    <label class="searchbox"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="search" placeholder="ابحث باليوزر @ أو بالقناة #"></label>
    <div class="chips-row" id="chipsRow"></div>
    <div class="list" id="list"></div>
    <nav class="tabbar" id="tabbar">
      <button data-tab="chats" class="on"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg><span>المحادثات</span><i class="tb-dot hidden" id="dotCh2"></i></button>
      <button data-tab="channels"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l8 4V6L6 10H4a1 1 0 0 0-1 1zM17.5 9a4 4 0 0 1 0 6"/></svg><span>القنوات</span><i class="tb-dot hidden" id="dotCh"></i></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>الإعدادات</span></button>
      <button data-tab="profile"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>الملف الشخصي</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="chatbar" id="chatbar">
      <button class="back" id="back" aria-label="رجوع"><svg viewBox="0 0 24 24" width="22" height="22"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="chatHead" class="chat-head"></div>
      <button class="icon-btn hidden" id="callAudioBtn" aria-label="مكالمة صوتية" title="مكالمة صوتية">☎</button>
      <button class="icon-btn hidden" id="callVideoBtn" aria-label="مكالمة فيديو" title="مكالمة فيديو">▣</button>
      <button class="icon-btn hidden" id="chatSearchBtn" aria-label="بحث في المحادثة"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="icon-btn hidden" id="chatMenuBtn" aria-label="خيارات المحادثة"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg></button>
    </header>
    <div id="pinBar" class="pin-bar hidden"></div>
    <section class="messages" id="messages"></section>
    <div class="composer-wrap hidden" id="composerWrap">
      <div id="replyBar" class="reply-bar hidden"></div>
      <div id="quickPop" class="quick-pop hidden"></div>
      <div id="roBar" class="ro-bar hidden"></div>
      <form class="composer" id="form">
        <button type="button" class="attach" id="attachBtn" aria-label="إرفاق"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 11.5 12.5 20a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6L15 7.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <input id="input" placeholder="اكتب رسالة..." autocomplete="off" maxlength="2000">
        <button type="button" class="voice" id="voiceBtn" aria-label="رسالة صوتية" title="رسالة صوتية">🎙</button>
        <button class="send" aria-label="إرسال"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 11.5 21 3l-8.5 18-2-7.5L3 11.5z" fill="currentColor"/></svg></button>
      </form>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileDoc" hidden>
<input type="file" id="fileSticker" accept="image/*" hidden>
<input type="file" id="storyFile" accept="image/*" hidden>
<div id="toast" class="toast"></div>
<div id="netBar" class="net-bar hidden">مفيش اتصال بالنت — الرسايل هتتبعت أول ما يرجع</div>

<script>
  // لو فشل تحميل module (غالبًا ملف firebase-config.js ناقص)، لا تترك المستخدم على الشعار.
  setTimeout(() => {
    const b = document.getElementById("boot"), e = document.getElementById("bootError");
    if (b && !b.classList.contains("hidden") && e) {
      e.hidden = false;
      e.textContent = "التطبيق لم يكتمل تحميله. تأكد من رفع firebase-config.js ثم أعد تحميل الصفحة.";
    }
  }, 8000);
</script>
<script type="module">
  import("./app.js?v=28").catch(err => {
    const e = document.getElementById("bootError");
    if (e) {
      e.hidden = false;
      e.textContent = "تعذّر تشغيل التطبيق: " + (err?.message || "خطأ JavaScript") + " — افتح الصفحة من جديد بعد رفع آخر نسخة.";
    }
    console.error("ES Chat boot error", err);
  });
</script>
</body>
</html>
